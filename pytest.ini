[pytest]
addopts = -ra -q --strict-markers --alluredir=report --clean-alluredir
testpaths = script
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
markers =
    ui: Selenium Web UI 测试
    smoke: 核心冒烟用例
    p0: P0 主链路或高风险用例
    p1: P1 重要功能或异常分支
    auth: 账户与登录模块
    certification: 用户与企业认证模块
    message: 消息与待办模块
    system: 系统管理模块
    declaration: 申报与合同模块
    transaction: 数据资产、交易与支付模块
    transfer: 数据传输模块
    archive: 存证、日志与归档模块
    e2e: 跨模块端到端串行用例
    destructive: 会新增或修改环境业务数据的用例
    production_registration: 会在生产环境创建真实账号，需额外显式确认
    production_product_submission: 会在生产环境提交数据产品审核，需额外显式确认
    production_product_approval: 管理员会在生产环境提交数据产品审核结果，需额外显式确认
    production_product_lifecycle: 会在生产环境上架、下架并提交产品变更审核，需额外显式确认
    production_product_order: 数据使用方会在生产环境创建产品采购订单，需额外显式确认
    production_order_provider_audit: 数据提供方会在生产环境提交产品订单审核结果，需额外显式确认
    production_order_operations_audit: 运营方会在生产环境提交产品订单审核结果，需额外显式确认
    production_order_contract_upload: 数据使用方会在生产环境上传产品订单合同，需额外显式确认
    production_order_contract_confirmation: 数据提供方会在生产环境提交合同确认结果，需额外显式确认
    production_order_payment: 数据使用方会在生产环境上传支付凭证并提交支付，需额外显式确认
    production_order_receipt_confirmation: 数据提供方会在生产环境提交收款确认结果，需额外显式确认
    production_order_delivery: 数据提供方会在生产环境提交订单交付，需额外显式确认
    production_order_acceptance: 数据使用方会在生产环境提交验收结果，需额外显式确认
